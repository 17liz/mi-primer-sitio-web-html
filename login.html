<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Mascotas — Huellitas Vet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--bg);
        }
        .login-visual {
            background:
                linear-gradient(160deg, rgba(61,46,34,0.75), rgba(196,120,74,0.45)),
                url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 3rem;
            color: #fff;
        }
        .login-visual h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }
        .login-visual p { opacity: 0.9; max-width: 28ch; }
        .login-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 20px;
            padding: 2.25rem;
            border: 1px solid var(--sand);
            box-shadow: var(--shadow);
        }
        .login-box h2 {
            font-family: 'Playfair Display', serif;
            color: var(--brown-dark);
            margin-bottom: 0.25rem;
        }
        .login-box .sub { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.92rem; }
        .back-link {
            display: inline-block;
            margin-bottom: 1.25rem;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
        }
        @media (max-width: 800px) {
            .login-page { grid-template-columns: 1fr; }
            .login-visual { min-height: 220px; padding: 2rem; }
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-visual">
            <div>
                <h1>Bienvenido de nuevo</h1>
                <p>Consulta el historial, citas y vacunas de tus mascotas en un solo lugar.</p>
            </div>
        </div>
        <div class="login-panel">
            <div class="login-box">
                <a href="index.html" class="back-link">← Volver al inicio</a>
                <h2>Mis Mascotas</h2>
                <p class="sub">Ingresa para acceder al portal de clientes</p>
                <form id="form-login" action="#" method="POST">
                    <div class="field">
                        <label for="usuario">Correo o número de cliente</label>
                        <input type="text" id="usuario" name="usuario" required placeholder="correo@ejemplo.com" autocomplete="username">
                    </div>
                    <div class="field">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
